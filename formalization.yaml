fidelity:
  divergences: The interval criterion is generalized from squares to every positive exponent k and permits
    arbitrary seed moduli through canonical closure. The square application changes the odd437 support
    and widths and reallocates all nine moment exponents while retaining the source binary geometry. Fourth/sixth
    data and exact exponents extend the pinned rk-lean applications. Unit conductors use standard sufficient
    bounds; no minimality assertion. Prime-local capacity includes all supports and widths with the explicit
    binary-square exception. Binary capacity is an intrinsic supremum of actual alphabets, not an assumed
    Bellman optimizer.
