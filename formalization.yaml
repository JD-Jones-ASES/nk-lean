status:
  scope: All 19 selected theorem statements are proved, including the three unconditional numerical bounds.
    The proof-bearing NKSolution has no admissions or definition holes. NKChallenge has 19 intentional theorem
    placeholders. The complete official local Comparator replay accepted proof commit 409bcef149ae96f40f69d38a17cf8bd7330dee98.
    See docs/VERIFICATION.md for later checks and the macOS host scope. The first Palomar submission failed
    because its module names collided with a dependency; the renamed modules require a new intake run.
    No global optimum, computed binary capacity, Bellman identity, or effective
    convergence rate is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
review:
  status: agent-reviewed
  reviewers:
  - Codex theorem-scope reviewer
  - Codex independent definition and signature reviewer
  notes: Separate agents reviewed the theorem statements, definitions, proof scope, and certificate assembly.
    This is agent review, not human peer review or source-author endorsement. Mechanical evidence is in
    docs/VERIFICATION.md.
fidelity:
  divergences: The interval criterion is generalized from squares to every positive integer k. Canonical
    closure permits arbitrary seed moduli. The square application changes odd supports, widths, and moment
    exponents while retaining Naslund's binary transition rules. Fourth- and sixth-power applications
    give the stated exact bounds. Unit conductors are sufficient bounds, without a minimality claim. Prime-depth
    capacity ranges over all interval alphabets and excludes binary squares. Binary capacity is defined
    from actual alphabets; no optimizer or Bellman identity is assumed.
acknowledgements: Eric Naslund, Dmitry Krachun, Imre Ruzsa, Khalid Younis, and the authors of the mathematical
