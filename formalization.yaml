version: v0.4
project:
  name: Lower bounds for sets without perfect-power differences
  description: Let D_k(N) be the largest size of a subset of {1, ..., N} with no positive k-th-power difference.
    We prove D_k(N) >= c_k N^alpha_k for every N >= 1, with positive constants c_k and exponents 0.75806770413,
    0.9142, and 0.95295 for squares, fourth powers, and sixth powers. The proofs use a general interval-moment
    criterion for every positive integer k. We also prove arithmetic lifting results, exact product and
    prime-depth laws for interval capacity, and existence of the binary square capacity limit. The square
    construction refines Naslund's published example while retaining its binary transition rules. All
    selected statements are proved in Lean.
  authors:
  - JD Jones
  responsible_maintainers:
  - JD Jones
  license: MIT
classification:
  arxiv:
  - math.NT
  - math.CO
  msc2020:
  - 11B30
  - 11B75
  - 05C20
sources:
- title: Square-difference-free sets of exponent 0.75806746
  authors:
  - Eric Naslund
  type: paper
  location: https://github.com/enaslund/sarkozy-lower-bound-0.758/blob/e5d693729e23762b063a55015ad79ccaf28a3217/papers/square-difference-free-sets-of-exponent-0.75806746.tex
  relationship: adapts
  author_endorsement: not-contacted
  note: Source of the square interval criterion, odd retained supports, and 25-state binary transition
    rules. This formalization generalizes the criterion to positive k, changes odd supports and widths,
    and gives a new exact allocation. The binary transition rules are unchanged.
- title: Square-Difference-Free Sets beyond the Three-Quarter Barrier
  authors:
  - Dmitry Krachun
  type: paper
  id: arXiv:2608.01325
  relationship: adapts
  author_endorsement: not-contacted
  note: Ranked modular blocks, word construction and CRT are the ancestry of the pinned rk-lean dependency.
    The source treats squares; its original numerical theorem is not rederived as a separate result here.
- title: Difference sets without squares
  authors:
  - Imre Z. Ruzsa
  type: paper
  id: doi:10.1007/BF02454169
  relationship: background
  author_endorsement: not-contacted
  note: Classical residue and digit constructions for power-difference-free sets.
- title: Lower bounds in the polynomial Szemeredi theorem
  authors:
  - Khalid Younis
  type: paper
  id: arXiv:1908.06058
  relationship: background
  author_endorsement: not-contacted
  note: Prior perfect-degree-base transfer and coprime prime-power/free-copy reductions. These unweighted
    antecedents are not claimed new.
- title: Prime powers units and finite subgroups of GL_n(Q)
  authors:
  - Keith Conrad
  type: other
  id: https://kconrad.math.uconn.edu/blurbs/gradnumthy/primepowerunitsandGLnQ.pdf
  location: Theorem 1.1, Remark 2.2, Theorem 2.3, Remark 2.4
  relationship: background
  author_endorsement: not-contacted
  note: The conductor reference. An unpublished expository note on the author's site; no DOI or arXiv
    identifier exists, so the URL is the identifier. It presents the classical structure of the unit
    groups modulo prime powers (cyclic for odd primes; generated by -1 and 5 for powers of 2) from which the
    sufficient conductors s_p(k) in NK.unitConductor_le_exponent_iff, NK.unitPower_stabilizes, and
    NK.unitPower_stabilizes_block follow. The Lean proofs use Mathlib's cyclicity theorems for these
    unit groups and a Newton lift for primes not dividing k; no statement of this note is formalized.
- title: Waring numbers over finite commutative local rings
  authors:
  - Ricardo A. Podestá
  - Denis E. Videla
  type: paper
  id: arXiv:2212.12396
  location: https://arxiv.org/abs/2212.12396
  relationship: background
  author_endorsement: not-contacted
  note: Graph-literature context, not a dependency. Studies the unit-power Cayley graphs
    G_R(k) = Cay(R, U_R(k)) of a finite commutative local ring R with gcd(k, |R|) = 1 and shows they are
    blow-ups of the residue-field graph along the cosets of the maximal ideal. This is a precedent for
    decomposing a power graph over a local ring. The prime-power graphs G_k(p^(ke)) used here take every
    kth power, nonunits included, allow primes dividing k, and decompose as lexicographic powers of the
    block graph G_k(p^k) rather than as blow-ups; the conclusion is the interval-capacity law. Nothing
    from this paper is used or formalized.
- title: On certain properties of the p-unitary Cayley graph over a finite ring
  authors:
  - Tung T. Nguyen
  - Nguyen Duy Tân
  type: paper
  id: arXiv:2403.05635
  location: https://arxiv.org/abs/2403.05635
  relationship: background
  author_endorsement: not-contacted
  note: Graph-literature context, not a dependency. Basic structural properties, including primality
    conditions, of p-unitary Cayley graphs over finite commutative rings. Cited as part of the same
    finite-ring unit-power graph literature; its hypotheses (unit generators, ring-theoretic primality)
    and conclusions differ from the full power-image graphs and interval capacities proved here.
    Nothing from this paper is used or formalized.
- title: 'On k-th unitary Cayley graphs over finite commutative rings: structure and decompositions'
  authors:
  - Ricardo A. Podestá
  - Denis E. Videla
  type: paper
  id: arXiv:2606.06774
  location: https://arxiv.org/abs/2606.06774
  relationship: background
  author_endorsement: not-contacted
  note: Graph-literature context, not a dependency (v1, 4 June 2026). Gives the blow-up decompositions
    of the kth unitary Cayley graph and its symmetrized version over a finite local ring when
    gcd(k, |R|) = 1. This is the closest published precedent for the local decomposition behind
    NK.prime_power_capacity; that theorem concerns all kth powers modulo p^(ke) for every k, including
    primes dividing k, via the unit conductor and a lexicographic product, and is proved here
    independently. The differences establish no priority claim in either direction. Nothing from this
    paper is used or formalized.
