version: v0.4
project:
  name: 'Interval moments for power-difference-free sets: square, fourth and sixth power bounds'
  description: A general interval-moment criterion for sets of integers avoiding nonzero kth-power differences,
    for every k >= 1. Finite interval alphabets on pairwise coprime perfect-kth-power bases, local moment
    inequalities and a strict sum-of-exponents surplus imply a uniform lower bound c N^alpha for every
    N >= 1. The proved applications have exact exponents 0.75806770413 for squares, 0.9142 for fourth
    powers and 0.95295 for sixth powers. Structural results prove canonical perfect-power closure and
    free copying from arbitrary seed moduli; full unit-power conductor stabilization including singular
    primes; exact interval-moment capacity multiplication under lexicographic graph products; an exact
    prime-depth capacity law outside binary squares; and existence of intrinsic binary interval capacity
    as the limit of finite-depth roots. The square witness combines Naslund's binary policy and odd supports
    with cooperative support changes, new widths, and a fresh exact global allocation. No global optimality
    or worldwide record claim is made. The private candidate remains under verification; PROOF_STATUS.md
    records the remaining independent replay and release gates.
  authors:
  - JD Jones
  responsible_maintainers:
  - JD Jones
  license: MIT
