name = "nkLean"
version = "0.1.0"
keywords = ["mathematics", "combinatorics", "number-theory", "palomar"]
defaultTargets = ["NK", "NKChallenge", "NKSolution", "Audit"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[require]]
name = "rkLean"
git = "https://github.com/JD-Jones-ASES/rk-lean.git"
rev = "4bf2e3a56b6a522764a4d03e5dc606c12376185e"

[[lean_lib]]
name = "NK"

[[lean_lib]]
name = "Audit"

[[lean_lib]]
name = "NKChallenge"

[[lean_lib]]
name = "NKSolution"
